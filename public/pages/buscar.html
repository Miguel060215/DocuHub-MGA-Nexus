<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuHub - Buscar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="l-wrapper">
          <header class="l-header">
            <div class="logo-circle">
                <img src="/assets/Logotipo.png" alt="Logo DocuHub" class="logo-img">
            </div>

            <nav class="l-nav-desktop">
                <a href="/">INICIO</a>
                <a href="/pages/buscar.html">BUSCAR</a>
                <a href="/pages/subir.html">SUBIR</a>
            </nav>
            
            <div class="l-nav-mobile">
                <span id="btn-menu">☰</span>
                <ul class="mobile-menu" id="menu-desplegable">
                    <li><a href="/">INICIO</a></li>
                    <li><a href="/pages/buscar.html">BUSCAR</a></li>
                    <li><a href="/pages/subir.html">SUBIR</a></li>
                </ul>
            </div>

            <div class="user-container">
                <a class="user-info" id="link-login" href="/pages/login.html">LOGIN</a>
                <div class="user-logged-info" id="panel-usuario" style="display: none;">
                    <span>Hola, <strong id="usuario-nombre">Usuario</strong></span>
                    <button type="button" class="btn-logout" onclick="cerrarSesion()">Salir</button>
                </div>
            </div>
        </header>

        <main class="l-main">
            <div class="search-container-wrapper">
                <div class="search-form-pill">
                    <input type="text" id="input-busqueda" placeholder="Búsqueda por palabra clave o título...">
                    <button type="button" id="btn-ejecutar-busqueda">Buscar</button>
                </div>
            </div>

            <div class="l-dos-columnas-catalog">
                
                <div class="panel-container">
                    <h3 class="panel-title">Filtros</h3>
                    <aside class="scrollable-panel">
                        <div class="filtro-grupo">
                            <h4>Carreras</h4>
                            <div class="checkbox-grid" id="carreras-checklist-container">
                                </div>
                            <button class="btn-full" style="display: none;">Mas carreras</button>
                        </div>
                    </aside>
                </div>

                <div class="panel-container">
                    <h3 class="panel-title">Resultados</h3>
                    <section class="scrollable-panel" id="resultados-container">
                        </section>
                </div>
            </div>
        </main>

        <footer class="l-footer">
            <div class="footer-content">
                <p>&copy; 2026 MGA Nexus</p>
                <div class="footer-contact">
                    <p>Tel: (656) 123-4567</p>
                    <p>Correo: mganexusdochub@gmail.com</p>
                </div>
            </div>
        </footer>
    </div>
    <script src="/js/auth-session.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
