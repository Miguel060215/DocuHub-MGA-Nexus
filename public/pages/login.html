<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuHub - Login / Registro</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="l-wrapper">
        <main class="l-main l-login-container">
            
            <div class="logo-circle-login" style="margin: 0 auto 2rem auto;">
                <img src="../assets/Logotipo.png" alt="Logo DocuHub" class="logo-img-login">
            </div>            

            <div class="l-form-container login-register-container">
                <div class="form-toggle">
                    <button id="btn-show-login" class="active">Iniciar</button>
                    <button id="btn-show-register">Registrar</button>
                </div>

                <!-- Formulario de Login -->
                <form id="form-login">
                    <label>Ingresa tu correo electrónico</label>
                    <input type="email" required placeholder="correo@ejemplo.com">

                    <label>Ingresa tu contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" required placeholder="Contraseña" class="password-input">
                        <button type="button" class="toggle-pass">👀</button>
                    </div>
                  <!-- Formulario de Login -->
                    <div class="capcha">
                        <div class="g-recaptcha" data-sitekey="6LfbYkItAAAAALPakf_wskgmV9uAr8iU2OUukHVb" id="captcha-login"></div>
                    </div>
                   <!-- aqui uso la primera api externa recapcha de google, la gratis por que somos pobres--> 
                    <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </form>

                <!-- Formulario de Registro (Sin etiquetas de form anidadas) -->
                <form id="form-register" class="hidden">
                    <label>Nombre(s)</label>
                    <input type="text" required placeholder="Tu nombre">

                    <label>Apellido Paterno</label>
                    <input type="text" required placeholder="Tu primer apellido">

                    <label>Apellido Materno</label>
                    <input type="text" required placeholder="Tu segundo apellido">

                    <label>Carrera Universitaria</label>
                    <select required>
                        <option value="" disabled selected>Selecciona tu carrera</option>
                        <option value="1">Ingeniería en Desarrollo de Software</option>
                        <option value="2">Ingeniería en Tecnologías de la Información</option>
                        <option value="3">Ingeniería en Mecatrónica</option>
                        <option value="4">Ingeniería Industrial</option>
                        <option value="5">Licenciatura en Administración</option>
                        <option value="6">Ingeniería en Logística</option>
                        <option value="7">Ingeniería en Energía</option>
                        <option value="8">Ingeniería en Nanotecnología</option>
                        <option value="9">Ingeniería en Sistemas Automotrices</option>
                        <option value="10">Ingeniería en Manufactura</option>
                    </select>

                    <label>Ingresa tu correo electrónico</label>
                    <input type="email" required placeholder="correo@ejemplo.com">

                    <label>Ingresa tu nombre de usuario único</label>
                    <input type="text" required placeholder="Nombre de usuario">

                    <label>Crea una contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="contraseña1" required placeholder="Contraseña">
                        <button type="button" class="toggle-pass">👀</button>
                    </div>

                    <div id="mensajes-validacion" class="mensajes-validacion">
                        <p>Cumple con las siguientes condiciones</p>
                        <p id="minimo">Mínimos 8 caracteres</p>
                        <p id="mayuscula">Al menos 1 mayúscula</p>
                        <p id="numero">Al menos 1 número</p>
                        <p id="especial">Al menos un carácter especial</p>
                    </div>

                    <label>Confirma tu contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="contraseña2" required placeholder="Confirma tu contraseña">
                        <button type="button" class="toggle-pass">👀</button>
                    </div>
                    <p id="coincidencia"></p>
                    <!-- Formulario de Registro -->
                    <div class="capcha">
                        <div class="g-recaptcha" data-sitekey="6LfbYkItAAAAALPakf_wskgmV9uAr8iU2OUukHVb" id="captcha-register"></div>
                    </div>                   
                    <button type="submit" class="btn-primary">REGISTRARSE</button>
                </form>
            </div>
            
        </main>
        
        <footer class="l-footer">
            <div class="footer-content">
                <p>&copy; 2026 MGA Nexus</p>
                <div class="footer-contact">
                    <p>Tel: (656) 123-4567</p>
                    <p>Correo: mganexusdochub@gmail.com</p>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="../js/main.js"></script>
    <!-- <script src="../js/validacion-contraseña.js"></script> -->
</body>
</html>
